version: '3.8'

services:
  php:
    build:
      dockerfile: docker/php/Dockerfile
    container_name: finance_app_php
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=finance_app
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - YII_DEBUG_TOOLBAR=0

  mysql:
    image: mysql:8.0
    container_name: finance_app_mysql
    environment:
      MYSQL_DATABASE: finance_app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  nginx:
    image: nginx:latest
    container_name: finance_app_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  parser:
    build: ./services/parser
    container_name: finance_app_parser
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    container_name: finance_app_cron
    volumes:
      - .:/var/www/html
    depends_on:
      - php
      - mysql

  keycloak_db:
    image: postgres:16-alpine
    container_name: finance_app_keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: finance_app_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8180:8080"
    depends_on:
      - keycloak_db

volumes:
  mysql_data:
  keycloak_db_data: